#cloud-config

# Cloud-init configuration for Hunyuan3D-2GP Docker build VM
# This script sets up Docker, Azure CLI, and builds the container image

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - curl
  - wget
  - git
  - unzip
  - jq

# Create build user with docker permissions
users:
  - default
  - name: builduser
    groups: docker
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# Configure Docker service
runcmd:
  # Start and enable Docker
  - systemctl start docker
  - systemctl enable docker
  
  # Install Azure CLI
  - curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
  
  # Clone Hunyuan3D-2GP repository
  - cd /home/builduser
  - git clone https://github.com/tencent/Hunyuan3D-2.git hunyuan3d-2gp
  - chown -R builduser:builduser /home/builduser/hunyuan3d-2gp
  
  # Copy custom Dockerfile
  - |
    cat > /home/builduser/hunyuan3d-2gp/Dockerfile.custom << 'EOF'
    # Production Dockerfile for Hunyuan3D-2GP API Server
    FROM nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04

    # Set environment variables
    ENV DEBIAN_FRONTEND=noninteractive
    ENV PYTHONUNBUFFERED=1
    ENV CUDA_VISIBLE_DEVICES=0

    # Install system dependencies
    RUN apt-get update && apt-get install -y \
        python3 \
        python3-pip \
        python3-dev \
        git \
        wget \
        curl \
        build-essential \
        libgl1-mesa-glx \
        libglib2.0-0 \
        libsm6 \
        libxext6 \
        libxrender-dev \
        libgomp1 \
        && rm -rf /var/lib/apt/lists/*

    # Create non-root user
    RUN useradd -m -u 1000 hunyuan && \
        mkdir -p /app /models /cache && \
        chown -R hunyuan:hunyuan /app /models /cache

    # Set working directory
    WORKDIR /app

    # Copy requirements and install Python dependencies
    COPY requirements.txt .
    RUN pip3 install --no-cache-dir --upgrade pip && \
        pip3 install --no-cache-dir -r requirements.txt

    # Copy application code
    COPY . .

    # Create model cache directory with proper permissions
    RUN mkdir -p /app/models /app/cache && \
        chown -R hunyuan:hunyuan /app

    # Switch to non-root user
    USER hunyuan

    # Expose port for API server
    EXPOSE 7860

    # Health check
    HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
        CMD curl -f http://localhost:7860/health || exit 1

    # Set default command
    CMD ["python3", "api_server.py", "--host", "0.0.0.0", "--port", "7860"]
    EOF
  
  # Create build script
  - |
    cat > /home/builduser/build-and-push.sh << 'EOF'
    #!/bin/bash
    set -e
    
    echo "Starting Hunyuan3D Docker build process..."
    
    # Login to Azure CLI (will be handled by managed identity or service principal)
    echo "Logging into Azure Container Registry..."
    az acr login --name ${acr_name}
    
    # Build Docker image
    echo "Building Docker image..."
    cd /home/builduser/hunyuan3d-2gp
    docker build -f Dockerfile.custom -t ${acr_name}.azurecr.io/hunyuan3d-2gp-api:latest .
    
    # Push to ACR
    echo "Pushing image to Azure Container Registry..."
    docker push ${acr_name}.azurecr.io/hunyuan3d-2gp-api:latest
    
    echo "Build and push completed successfully!"
    
    # Optional: Clean up local image to save space
    docker rmi ${acr_name}.azurecr.io/hunyuan3d-2gp-api:latest || true
    
    echo "Build VM task completed. VM can be safely deleted."
    EOF
  
  # Make build script executable
  - chmod +x /home/builduser/build-and-push.sh
  - chown builduser:builduser /home/builduser/build-and-push.sh
  
  # Create completion marker
  - touch /tmp/cloud-init-complete

write_files:
  - path: /etc/systemd/system/hunyuan-build.service
    content: |
      [Unit]
      Description=Hunyuan3D Docker Build Service
      After=docker.service
      Requires=docker.service
      
      [Service]
      Type=oneshot
      User=builduser
      WorkingDirectory=/home/builduser
      ExecStart=/home/builduser/build-and-push.sh
      RemainAfterExit=yes
      
      [Install]
      WantedBy=multi-user.target
    permissions: '0644'

# Final commands
final_message: |
  Hunyuan3D Build VM is ready!
  
  To start the build process, run:
  sudo systemctl start hunyuan-build.service
  
  To check build status:
  sudo systemctl status hunyuan-build.service
  journalctl -u hunyuan-build.service -f
  
  SSH access available for user 'builduser'